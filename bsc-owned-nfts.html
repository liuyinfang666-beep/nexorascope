<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexoraScope · BNB NFT 持有清单</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#e8edf8}body{max-width:900px;margin:0 auto;padding:28px 18px;line-height:1.6}main{background:#131b30;border:1px solid #263452;border-radius:18px;padding:22px}h1{font-size:23px;margin:0 0 8px}p,small{color:#aebbd2}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1120;padding:14px;border-radius:10px;max-height:460px;overflow:auto}button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;margin:4px 8px 4px 0}#check{background:#76e0b0;color:#092018}#next{background:#34435f;color:white}.stat{background:#0d1528;border-radius:12px;padding:14px;margin:12px 0}.stat b{font-size:22px;display:block}
</style></head><body><main><h1>BNB Chain · 当前 NFT 持有清单</h1><p>通过 Ankr NFT API 查询目标钱包当前持有的 ERC-721 / ERC-1155 NFT。每页最多 50 项，可继续翻页。</p><div class="stat">钱包地址<b>0x2a7FA743178B83fAB841000d57144C7CB1DEd359</b></div><p id="status">尚未查询</p><div class="stat">本页 NFT 数量<b id="count">—</b></div><button id="check">查询第一页</button><button id="next" disabled>查询下一页</button><h3>本页 NFT 清单</h3><pre id="result">尚无结果</pre><small>注意：这是 Ankr 索引器提供的当前持有清单，不是授权清单。查询结果为空也不能单独证明钱包没有 NFT 或授权。</small></main><script>
(()=>{const API="https://nexorascope-security-api-preview.liuyinfang666.workers.dev/api/bsc-owned-nfts";const OWNER="0x2a7FA743178B83fAB841000d57144C7CB1DEd359";let token=null,busy=false;const $=id=>document.getElementById(id);async function query(next){if(busy)return;busy=true;$("status").textContent="正在查询 Ankr NFT API…";$("check").disabled=true;$("next").disabled=true;try{const u=new URL(API);u.searchParams.set("address",OWNER);if(next&&token)u.searchParams.set("pageToken",token);const r=await fetch(u,{cache:"no-store"});const d=await r.json();if(!r.ok||d.status!=="success")throw new Error(d.message||"HTTP "+r.status);token=d.nextPageToken||null;$("count").textContent=Number(d.nftCount||0).toLocaleString();$("status").textContent=token?"本页查询成功；还有下一页。":"本页查询成功；Ankr 未返回下一页。";$("result").textContent=JSON.stringify(d,null,2);$("next").disabled=!token;}catch(e){$("status").textContent="查询失败："+String(e.message||e);$("result").textContent=String(e.stack||e);}finally{busy=false;$("check").disabled=false;}}$("check").addEventListener("click",()=>{token=null;query(false)});$("next").addEventListener("click",()=>query(true));})();
</script></body></html>
